name: Publish verified plugin release

on:
  workflow_call:
    inputs:
      devtools-ref:
        description: Deprecated compatibility input. The workflow checks out its own immutable revision.
        type: string
        required: false
        default: ''
      mode:
        description: tag for an existing version tag, or nightly for an immutable commit prerelease.
        type: string
        default: tag
      prerelease:
        description: auto, true, or false. Prerelease version suffixes always require a prerelease.
        type: string
        default: auto
      project:
        type: string
        default: .
      virions:
        type: string
        default: virions
      prepare-dependencies:
        type: boolean
        default: false
      php-version:
        type: string
        default: '8.1'
    outputs:
      artifact-id:
        value: ${{ jobs.build.outputs.artifact-id }}
      sha256:
        value: ${{ jobs.build.outputs.sha256 }}
      release-url:
        value: ${{ jobs.publish.outputs.release-url }}

permissions:
  contents: read

concurrency:
  group: devtools-publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: (inputs.mode == 'tag' && github.ref_type == 'tag' && github.event_name == 'push') || (inputs.mode == 'nightly' && github.ref_type == 'branch' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))
    uses: ./.github/workflows/build-plugin.yml
    permissions:
      contents: read
    with:
      project: ${{ inputs.project }}
      virions: ${{ inputs.virions }}
      prepare-dependencies: ${{ inputs.prepare-dependencies }}
      php-version: ${{ inputs.php-version }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    outputs:
      release-url: ${{ steps.publish.outputs.release-url }}
    steps:
      - name: Verify the reusable release workflow revision
        id: workflow-identity
        shell: bash
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
          LEGACY_REF: ${{ inputs.devtools-ref }}
        run: |
          set -euo pipefail
          WORKFLOW_SHA="$(jq -r '.workflow_sha // empty' <<< "$JOB_CONTEXT")"
          WORKFLOW_REPOSITORY="$(jq -r '.workflow_repository // empty' <<< "$JOB_CONTEXT")"
          if [[ ! "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ || ! "$WORKFLOW_REPOSITORY" =~ ^[^/]+/[^/]+$ ]]; then
            echo "GitHub did not provide an immutable reusable workflow identity." >&2
            exit 2
          fi
          printf 'sha=%s\nrepository=%s\n' "$WORKFLOW_SHA" "$WORKFLOW_REPOSITORY" >> "$GITHUB_OUTPUT"
          if [ -n "$LEGACY_REF" ]; then
            echo "::warning::devtools-ref is deprecated and ignored; release verification follows the called workflow revision."
          fi

      - name: Check out release verification tools
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ steps.workflow-identity.outputs.repository }}
          ref: ${{ steps.workflow-identity.outputs.sha }}
          path: .devtools-tool
          persist-credentials: false

      - name: Verify release tool revision
        shell: bash
        env:
          WORKFLOW_SHA: ${{ steps.workflow-identity.outputs.sha }}
        run: test "$(git -C .devtools-tool rev-parse HEAD)" = "$WORKFLOW_SHA"

      - name: Download the exact build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-artifact

      - name: Verify artifact hash and release version
        id: verify
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/release-artifact
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: node .devtools-tool/.github/scripts/artifact-contract.mjs release "$ARTIFACT_DIRECTORY/build-metadata.json"

      - name: Publish the verified artifact without rebuilding
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_PRERELEASE: ${{ steps.verify.outputs.prerelease }}
          PLUGIN_NAME: ${{ steps.verify.outputs.plugin-name }}
          PLUGIN_VERSION: ${{ steps.verify.outputs.plugin-version }}
          PHAR: ${{ steps.verify.outputs.phar }}
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/release-artifact
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=(--generate-notes)
          if [ "$RELEASE_MODE" = tag ]; then FLAGS+=(--verify-tag); else FLAGS+=(--target "$RELEASE_SHA" --latest=false); fi
          if [ "$RELEASE_PRERELEASE" = true ]; then FLAGS+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "$PHAR" "$ARTIFACT_DIRECTORY/build-metadata.json" "$ARTIFACT_DIRECTORY/SHA256SUMS.txt" \
            --title "$PLUGIN_NAME $PLUGIN_VERSION ($RELEASE_TAG)" "${FLAGS[@]}"
          URL="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
          printf 'release-url=%s\n' "$URL" >> "$GITHUB_OUTPUT"
