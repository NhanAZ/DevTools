name: Axolotl-PM compatibility

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      verify_baseline:
        description: Run the representative gate even when the stable release matches the verified baseline.
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: axolotl-compatibility
  cancel-in-progress: false

jobs:
  representative:
    runs-on: ubuntu-24.04
    env:
      BASELINE_TAG: "5.49.1"
      BASELINE_SHA: dfe0d07e48a9e8d5a4a242fa43ff1cd3b743a955
    steps:
      - name: Resolve latest stable Axolotl-PM release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_BASELINE: ${{ inputs.verify_baseline || false }}
        run: |
          set -euo pipefail
          release="$(gh api repos/axolotl-pm/PocketMine-MP/releases/latest)"
          tag="$(jq -er '.tag_name' <<< "$release")"
          sha="$(gh api "repos/axolotl-pm/PocketMine-MP/commits/$tag" --jq '.sha')"
          phar_url="$(jq -er '.assets[] | select(.name == "PocketMine-MP.phar") | .browser_download_url' <<< "$release")"
          digest="$(jq -er '.assets[] | select(.name == "PocketMine-MP.phar") | .digest' <<< "$release")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          candidate=false
          if [[ "$tag" != "$BASELINE_TAG" || "$sha" != "$BASELINE_SHA" || "$VERIFY_BASELINE" == "true" ]]; then
            candidate=true
          fi
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "phar_url=$phar_url"
            echo "digest=${digest#sha256:}"
            echo "candidate=$candidate"
          } >> "$GITHUB_OUTPUT"
          printf 'Latest stable: %s at %s. Baseline: %s at %s. Run gate: %s.\n' "$tag" "$sha" "$BASELINE_TAG" "$BASELINE_SHA" "$candidate"

      - name: Check out representative consumer
        if: steps.release.outputs.candidate == 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: NhanAZ-Plugins/VisibleBorder
          ref: 2ccbc4df06017659fa18761da6c4fec2e0093a29
          path: compatibility/VisibleBorder
          persist-credentials: false

      - name: Check out pinned libRegRsp
        if: steps.release.outputs.candidate == 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: NhanAZ-Libraries/libRegRsp
          ref: 04766ae683a1ba63ed297730f7f2e8628aac3666
          path: compatibility/VisibleBorder/virions/libRegRsp
          persist-credentials: false

      - name: Check out candidate Axolotl-PM source
        if: steps.release.outputs.candidate == 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: ${{ steps.release.outputs.sha }}
          path: .devtools-dependencies/axolotl-pm
          persist-credentials: false

      - name: Check out Axolotl-PM PHP setup helper
        if: steps.release.outputs.candidate == 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: axolotl-pm/setup-php-action
          ref: b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
          path: .devtools-dependencies/setup-php-action
          persist-credentials: false

      - name: Set up Axolotl-PM PHP
        if: steps.release.outputs.candidate == 'true'
        shell: bash
        env:
          INPUT_PHP-VERSION: "8.1"
          INPUT_PM-VERSION-MAJOR: "5"
          INPUT_INSTALL-PATH: ./.php-bin
        run: node "$GITHUB_WORKSPACE/.devtools-dependencies/setup-php-action/dist/index.js"

      - name: Validate dependency and source
        if: steps.release.outputs.candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict --working-dir=compatibility/VisibleBorder/virions/libRegRsp
          find compatibility/VisibleBorder/src compatibility/VisibleBorder/tools -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build and analyze representative PHAR
        if: steps.release.outputs.candidate == 'true'
        id: build
        uses: NhanAZ/DevTools@v1.0.1
        with:
          project: compatibility/VisibleBorder
          virions: compatibility/VisibleBorder/virions
          output: compatibility/build
          phpstan: max
          phpstan-server: .devtools-dependencies/axolotl-pm

      - name: Verify PHAR content
        if: steps.release.outputs.candidate == 'true'
        shell: bash
        env:
          PHAR_PATH: ${{ steps.build.outputs.phar }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -euo pipefail
          php compatibility/VisibleBorder/tools/verify-build.php "$PHAR_PATH" "$BUILD_METADATA" compatibility/VisibleBorder/virions/libRegRsp
          mkdir -p compatibility/evidence
          cp "$BUILD_METADATA" compatibility/evidence/devtools-build.json

      - name: Download exact stable server PHAR
        if: steps.release.outputs.candidate == 'true'
        shell: bash
        env:
          PHAR_URL: ${{ steps.release.outputs.phar_url }}
          PHAR_DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$PHAR_URL" --output compatibility/PocketMine-MP.phar
          echo "$PHAR_DIGEST  compatibility/PocketMine-MP.phar" | sha256sum --check

      - name: Run isolated server smoke
        if: steps.release.outputs.candidate == 'true'
        shell: bash
        env:
          PLUGIN_PHAR: ${{ steps.build.outputs.phar }}
          SERVER_TAG: ${{ steps.release.outputs.tag }}
          SERVER_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          run = Path("compatibility/runtime").resolve()
          run.mkdir(parents=True)
          plugin = Path(os.environ["PLUGIN_PHAR"]).resolve()
          server = Path("compatibility/PocketMine-MP.phar").resolve()
          plugins = run / "plugins"
          plugins.mkdir()
          shutil.copy2(plugin, plugins / plugin.name)
          (run / "server.properties").write_text(
              "language=eng\nserver-ip=127.0.0.1\nserver-port=0\nenable-ipv6=off\n"
              "enable-query=off\nxbox-auth=off\nlevel-type=FLAT\nview-distance=2\nmax-players=1\n",
              encoding="utf-8",
          )
          (run / "pocketmine.yml").write_text(
              "settings:\n  async-workers: 2\n  enable-dev-builds: true\n  send-usage: false\n"
              "auto-report:\n  enabled: false\nauto-updater:\n  enabled: false\n"
              "network:\n  upnp-forwarding: false\n",
              encoding="utf-8",
          )
          log = run / "console.log"
          pack_seen = False
          with log.open("w", encoding="utf-8") as output:
              process = subprocess.Popen(
                  ["php", str(server), "--no-wizard", "--disable-ansi", f"--data={run}", f"--plugins={plugins}"],
                  cwd=run,
                  stdin=subprocess.PIPE,
                  stdout=output,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              deadline = time.monotonic() + 60
              while time.monotonic() < deadline and process.poll() is None:
                  content = log.read_text(encoding="utf-8", errors="replace")
                  packs = list(run.rglob("VisibleBorder.mcpack"))
                  if "Done (" in content and "Enabling VisibleBorder" in content and packs:
                      with zipfile.ZipFile(packs[0]) as archive:
                          assert "manifest.json" in archive.namelist()
                      pack_seen = True
                      break
                  time.sleep(0.25)
              if process.poll() is None and process.stdin:
                  process.stdin.write("stop\n")
                  process.stdin.flush()
              try:
                  exit_code = process.wait(timeout=20)
              except subprocess.TimeoutExpired:
                  process.kill()
                  exit_code = process.wait()
          content = log.read_text(encoding="utf-8", errors="replace")
          errors = [line for line in content.splitlines() if any(f"/{level}]" in line for level in ("ERROR", "CRITICAL", "EMERGENCY"))]
          result = {
              "server_tag": os.environ["SERVER_TAG"],
              "server_sha": os.environ["SERVER_SHA"],
              "plugin_sha256": hashlib.sha256(plugin.read_bytes()).hexdigest(),
              "pack_seen": pack_seen,
              "pack_removed_on_stop": not list(run.rglob("VisibleBorder.mcpack")),
              "exit_code": exit_code,
              "errors": errors,
          }
          (run / "result.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2))
          assert pack_seen and result["pack_removed_on_stop"] and exit_code == 0 and not errors
          PY

      - name: Upload compatibility evidence
        if: always() && steps.release.outputs.candidate == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: axolotl-${{ steps.release.outputs.tag }}-visibleborder
          path: |
            compatibility/runtime/console.log
            compatibility/runtime/result.json
            compatibility/evidence/devtools-build.json
          if-no-files-found: warn
          retention-days: 30

      - name: Record candidate result
        if: always() && steps.release.outputs.candidate == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_TAG: ${{ steps.release.outputs.tag }}
          SERVER_SHA: ${{ steps.release.outputs.sha }}
          GATE_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo "Axolotl-PM $SERVER_TAG at $SERVER_SHA"
            echo
            echo "Representative VisibleBorder gate: $GATE_STATUS."
            echo "See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID for PHPStan max, dependency validation, PHAR build, content validation and isolated runtime smoke."
            echo "This result does not certify every repository. Review the dependency graph and run affected consumers before changing their source or pins."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            exit 0
          fi
          title="Axolotl-PM $SERVER_TAG compatibility"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "in:title $title" --json title,number | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -n1)"
          if [[ -n "$existing" ]]; then
            exit 0
          fi
          {
            printf 'Stable release: https://github.com/axolotl-pm/PocketMine-MP/releases/tag/%s\n\n' "$SERVER_TAG"
            printf 'Source commit: `%s`\n\n' "$SERVER_SHA"
            printf 'Representative check: %s\n\n' "$GATE_STATUS"
            printf 'Workflow evidence: %s/%s/actions/runs/%s\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Review affected repositories using the dependency graph. Run their applicable PHPStan max, dependency, PHAR and runtime checks before updating pins. Do not merge or release based on this issue alone.\n'
          } > compatibility/issue-body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file compatibility/issue-body.md
